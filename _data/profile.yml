short_bio: >-
  <p>
    I am a first-year Ph.D. student in Data Science and Engineering at the
    <strong>Center for Data Science, Academy for Advanced Interdisciplinary Studies,
    Peking University</strong>. I am advised by
    <strong><a href="https://zwt233.github.io/" target="_blank" rel="noopener">Prof. Wentao Zhang</a></strong>
    and participate in a joint training program with Beijing Zhongguancun Academy.
  </p>
  <p>
    My research sits at the intersection of <strong>data-centric AI</strong> and agentic systems.
    I am particularly interested in how better data and evaluation can help
    <strong>computer-use and hybrid agents</strong> learn more effectively and behave more reliably.
  </p>
  <p>
    I am currently a research intern with the <strong>Qwen team at Alibaba</strong>, working with
    <strong>Que Shen</strong> on computer-use agents. I am also a core contributor to
    <a href="https://github.com/OpenDCAI/DataFlow" target="_blank" rel="noopener">DataFlow</a>.
    Previously, I worked on multimodal pre-training with the <strong>LongCat team at Meituan</strong>.
    I received my B.S. in Information and Computing Science from Beijing University of Posts and
    Telecommunications, where I was advised by <strong>Prof. Qinmeng Zou</strong>.
  </p>
  <div class="research-keywords">
    <span>Data-centric AI</span><span>Computer-Use Agents (CUA)</span><span>Hybrid Agents</span>
  </div>

